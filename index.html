<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Galería de Maquetas</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <h1>Galería de Maquetas</h1>
    <p class="subtitle">Vista previa de todas las maquetas HTML del proyecto</p>
  </header>

  <main>
    <div id="empty" class="empty" hidden>
      <p>No se encontraron maquetas.</p>
      <p>Agrega un archivo <code>.html</code> (o una carpeta con <code>index.html</code>) dentro de <code>/maquetas</code> y vuelve a desplegar.</p>
    </div>
    <div id="grid" class="grid"></div>
  </main>

  <footer class="bottom">
    <span id="count"></span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
